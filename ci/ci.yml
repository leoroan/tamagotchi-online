# CI: corre en cada push y PR que NO sea a main (main ya pasa por deploy.yml).
# Es la red de seguridad del proyecto: si esto está verde, el juego anda.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
