# Deploy a GitHub Pages.
#
# Requisitos (una sola vez):
#   Settings -> Pages -> Source: "GitHub Actions"
#
# Por qué NO usamos Vercel (que fue la recomendación original): vos pediste
# gh-pages, y gh-pages sirve perfecto para esto porque el juego es 100%
# estático + un backend externo (Supabase). No hay servidor que mantener.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # GitHub Pages sirve el sitio bajo /<repo>/. El `base` de Vite tiene que
      # coincidir o todos los assets dan 404 (el clásico "página en blanco").
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
